services:
  db:
    image: postgres:16
    container_name: homecare-db
    environment:
      POSTGRES_DB: homecare
      POSTGRES_USER: homecare
      POSTGRES_PASSWORD: homecare
    ports:
      - "${DB_PORT:-5434}:5432"
    volumes:
      - homecare-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U homecare -d homecare"]
      interval: 3s
      timeout: 3s
      retries: 20
volumes:
  homecare-data:
