server:
  port: ${SERVER_PORT:8081}

spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5434/homecare}
    username: ${DB_USER:homecare}
    password: ${DB_PASSWORD:homecare}
  servlet:
    multipart:
      max-file-size: 6MB   # documents may be 5 MB; DocumentStorage and PhotoStorage enforce their own limits
      max-request-size: 6MB
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

app:
  uploads:
    dir: ${UPLOADS_DIR:./uploads}
  jwt:
    # Override JWT_SECRET in any real environment (min 32 chars)
    secret: ${JWT_SECRET:dev-only-secret-change-me-dev-only-secret}
    expiry-minutes: 120
  google:
    client-id: ${GOOGLE_CLIENT_ID:}
  whatsapp:
    # Alerts to the admin. While enabled is false nothing is sent: the message is only written to the log (test mode).
    enabled: ${WHATSAPP_ENABLED:false}
    token: ${WHATSAPP_TOKEN:}
    phone-number-id: ${WHATSAPP_PHONE_NUMBER_ID:}
    api-version: ${WHATSAPP_API_VERSION:}
    admin-to: ${WHATSAPP_ADMIN_TO:}
    template-name: ${WHATSAPP_TEMPLATE_NAME:new_booking_details}
    language: ${WHATSAPP_TEMPLATE_LANGUAGE:en}
  email:
    # Alerts to the admin by email. While enabled is false nothing is sent: the email is only written to the log (test mode).
    enabled: ${EMAIL_ENABLED:false}
    host: ${EMAIL_SMTP_HOST:}
    port: ${EMAIL_SMTP_PORT:587}
    username: ${EMAIL_USERNAME:}
    password: ${EMAIL_PASSWORD:}
    from: ${EMAIL_FROM:}
    # One address, or several separated by commas
    admin-to: ${EMAIL_ADMIN_TO:}
    # The link at the bottom of the email: the site's address (PUBLIC_URL, else the frontend's CORS_ORIGIN) plus /admin
    admin-url: ${PUBLIC_URL:${CORS_ORIGIN:http://localhost:5173}}/admin
  payhere:
    # off: no fees. simulated: a pretend PayHere for trying the flow. sandbox / live: the real PayHere.
    mode: ${PAYHERE_MODE:off}
    merchant-id: ${PAYHERE_MERCHANT_ID:}
    merchant-secret: ${PAYHERE_MERCHANT_SECRET:}
    # The public address of this backend. PayHere calls back to it after a payment, so it cannot be localhost.
    public-api-url: ${PUBLIC_API_URL:}
    # Where families are sent back to after paying
    site-url: ${PUBLIC_URL:${CORS_ORIGIN:http://localhost:5173}}
  notifications:
    # How the admin hears about a booking request: email or whatsapp
    channel: ${NOTIFY_CHANNEL:email}
    scheduler-enabled: true
  cors:
    allowed-origin: ${CORS_ORIGIN:http://localhost:5173}
